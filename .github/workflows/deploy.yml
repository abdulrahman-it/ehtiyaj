name: Deploy to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  web-deploy:
    # Deployment is deliberately disabled until a separate approved change removes this guard.
    if: ${{ false }}
    name: Deploying to Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Upload only this explicit list; no remote sync, clean-slate or deletion.
      - name: Upload application files via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
        run: >-
          python3 .github/scripts/ftp_upload.py
          --local-dir Ehtiya/htdocs/
          --server-dir /htdocs/
          --manifest .github/deploy-files.txt
